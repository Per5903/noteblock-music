plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version "${minotaur_version}"
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/releases/'
		content {
			includeGroup 'com.terraformersmc'
		}
	}
}

base {
	archivesName = 'nbmusic'
}

loom {
	mods {
		"nbmusic" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	// ./gradlew runGameTest — headless-сервер ставит схему, жмёт кнопку и сверяет тайминг нот
	// ./gradlew runClientGameTest — настоящий клиент: команды /nbmusic, игра, скриншоты
	configureTests {
		createSourceSet = true
		modId = "nbmusic-gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// MP3-декодер (MIT, 38 КБ) — вкладывается в jar мода
	implementation "fr.delthas:javamp3:${project.javamp3_version}"
	include "fr.delthas:javamp3:${project.javamp3_version}"
	// кнопка настроек в списке модов; в рантайме не обязателен
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

test {
	useJUnitPlatform()
}

// Публикация: MODRINTH_TOKEN=... ./gradlew modrinth  (см. PUBLISHING.md)
modrinth {
	// MODRINTH_DEBUG=1 — только показать, что уйдёт, без загрузки (токен тогда не нужен)
	debugMode = System.getenv("MODRINTH_DEBUG") != null
	token = System.getenv("MODRINTH_TOKEN") ?: (System.getenv("MODRINTH_DEBUG") != null ? "debug" : null)
	projectId = "noteblock-music"
	versionNumber = project.version
	versionName = "NoteBlock Music ${project.version}"
	versionType = "beta"
	uploadFile = tasks.jar
	additionalFiles = [tasks.sourcesJar]
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	changelog = provider { file("CHANGELOG.md").text.split(/\n## /)[1].with { "## " + it }.trim() }
	syncBodyFrom = provider { file("docs/modrinth.md").text }
	dependencies {
		required.project "fabric-api"
		optional.project "modmenu"
	}
}
if (System.getenv("MODRINTH_DEBUG") == null) {
	tasks.modrinth.dependsOn(tasks.modrinthSyncBody)
}
[tasks.modrinth, tasks.modrinthSyncBody].each { it.notCompatibleWithConfigurationCache("Minotaur читает project во время выполнения") }
